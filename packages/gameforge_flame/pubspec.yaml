name: gameforge_flame
description: >-
  Optional Flame game engine adapter for GameForge providing lifecycle,
  pause/resume, score, health, and event synchronization.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  gameforge:
    path: ../../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
