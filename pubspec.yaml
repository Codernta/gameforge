name: gameforge
description: >-
  A modular, engine-independent Flutter gameplay toolkit for scores, health,
  levels, inventory, rewards, achievements, timers, sessions, events, and
  persistence.
version: 0.1.0
repository: https://github.com/Codernta/gameforge
topics:
  - game
  - game-development
  - toolkit
  - gameplay
  - flutter

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
